name: Release

on:
  push:
    branches:
      - main

concurrency: release-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # npm trusted publishing (OIDC): npm exchanges the job's GitHub identity
    # token for a short-lived publish credential, so there is no NPM_TOKEN to
    # expire. Each published package must list this repo + release.yml as its
    # Trusted Publisher on npmjs.com. contents/pull-requests: the release PR,
    # version commits, tags and GitHub releases.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v3
        with:
          node-version: 22.x

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install Dependencies
        run: npm ci

      # No NPM_TOKEN: without it changesets/action writes no .npmrc auth line,
      # so `npm publish` authenticates via OIDC (and adds provenance).
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send a Discord notification if a publish happens
        if: steps.changesets.outputs.published == 'true'
        continue-on-error: true # a missing/broken webhook must never fail a good release
        uses: Ilshidur/action-discord@0.3.2
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: '📦 {{ EVENT_PAYLOAD.repository.full_name }} published a new release to npm.'
